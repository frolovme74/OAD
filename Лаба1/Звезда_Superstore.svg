<text x="343" y="158" text-anchor="end" font-family="Times New Roman, serif" font-size="14.5">SMALLINT</text>
<text x="57" y="180" font-family="Times New Roman, serif" font-size="14.5">Название месяца</text>
<text x="343" y="180" text-anchor="end" font-family="Times New Roman, serif" font-size="14.5">VARCHAR(10)</text>
<text x="57" y="202" font-family="Times New Roman, serif" font-size="14.5">День месяца</text>
<text x="343" y="202" text-anchor="end" font-family="Times New Roman, serif" font-size="14.5">SMALLINT</text>
<text x="57" y="224" font-family="Times New Roman, serif" font-size="14.5">День недели</text>
<text x="343" y="224" text-anchor="end" font-family="Times New Roman, serif" font-size="14.5">SMALLINT</text>
<text x="57" y="246" font-family="Times New Roman, serif" font-size="14.5">Признак выходного дня</text>
<text x="343" y="246" text-anchor="end" font-family="Times New Roman, serif" font-size="14.5">BOOLEAN</text>
</g>
